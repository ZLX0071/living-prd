<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../shared/tokens.css">
<style>
.session { max-width:880px; margin:0 auto; padding:32px 24px 64px; }
.session-head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
.session-meta { font:12px var(--font-mono); color:var(--muted); }
.progressline { height:4px; background:var(--hairline); border-radius:999px; overflow:hidden; margin:14px 0 26px; }
.progressline .fill { height:100%; background:var(--ink); }
.chat { display:grid; gap:14px; }
.bubble-row { display:flex; }
.bubble { max-width:560px; padding:12px 16px; border:1px solid var(--hairline); border-radius:6px; background:white; font-size:14px; line-height:1.65; }
.bubble .who { display:block; font:11px var(--font-mono); color:var(--muted); margin-bottom:6px; }
.bubble.me { margin-left:auto; color:white; background:var(--ink); border-color:var(--ink); }
.bubble.me .who { color:#bdbdbd; }
.followup { border-style:dashed; border-color:#c9c9c9; background:var(--paper); }
.followup .who { color:var(--secondary); }
.composer { position:sticky; bottom:0; margin-top:26px; padding:14px 0; background:linear-gradient(transparent, var(--paper) 30%); display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:end; }
.composer textarea { min-height:72px; padding:10px 12px; border:1px solid var(--hairline); border-radius:6px; font:inherit; resize:vertical; background:white; }
.composer .tools { display:grid; gap:8px; justify-items:start; }
.hint-chip { font-size:11px; color:var(--muted); }
.session-links { margin-top:22px; display:flex; gap:16px; font-size:12px; }
.session-links a { color:var(--muted); }
.tag { display:inline-block; padding:2px 8px; border:1px solid var(--hairline); border-radius:999px; color:var(--secondary); font-size:11px; }
</style>
<title>模拟面试</title></head>
<body><div id="app"></div><script type="module">
import { mount, shell } from '../shared/components.js';
const nav = [
  { href: './prep-home.html', label: '准备', pageId: 'prep-home' },
  { href: './interview-session.html', label: '面试', pageId: 'interview-session' },
  { href: './report-detail.html', label: '报告', pageId: 'report-detail' },
  { href: './mistake-book.html', label: '错题本', pageId: 'mistake-book' },
];
mount(shell({ active: 'interview-session', nav, content: `
<main class="session">
  <div class="session-head">
    <div><div class="eyebrow">Mock Interview · 字节跳动 产品经理（暑期实习）</div><h1 style="font-size:30px;margin:8px 0 0">整场模拟进行中</h1></div>
    <div id="session-progress" class="session-meta">第 3/10 题 · 剩余 18:32 · 提示剩 2</div>
  </div>
  <div class="progressline"><div class="fill" style="width:30%"></div></div>
  <div class="chat">
    <div class="bubble-row"><div class="bubble" id="q3-bubble"><span class="who">面试官 · 第 3 题 · 项目追问 · 难度 2/3</span>接下来聊聊你简历里的校园公众号项目。请介绍一下你负责的部分，以及你观察到的数据变化。</div></div>
    <div class="bubble-row"><div class="bubble me"><span class="who">你</span>我负责内容排期和两篇深度选题的策划。在我接手的两个月里，公众号平均阅读从 6000 涨到 1.2 万，翻了大约一倍。</div></div>
    <div class="bubble-row"><div class="bubble followup" id="followup-chip"><span class="who">面试官 · 追问 1/2</span>阅读量翻倍的主要归因是什么？你在其中做了哪个关键动作？</div></div>
  </div>
  <div class="composer">
    <div class="tools">
      <button class="button" id="hint-button">提示 · 剩 2 次</button>
      <span class="hint-chip">Enter 发送 · Shift+Enter 换行</span>
    </div>
    <textarea id="answer-input" placeholder="输入你的回答（20-2000 字）…"></textarea>
    <button class="button primary" id="send-btn">发送</button>
  </div>
  <div class="session-links">
    <a href="./interview-states.html" data-nav="interview-states">查看边界状态（次数用尽 / 网络错误 / 退出确认）→</a>
    <a href="./report-detail.html" data-nav="report-detail">完成全部作答后 → 生成练习报告</a>
  </div>
</main>` }));
</script></body></html>
