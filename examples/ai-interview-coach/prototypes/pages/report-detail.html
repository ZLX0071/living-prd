<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../shared/tokens.css">
<style>
.report-head { display:grid; grid-template-columns: 180px minmax(0,1fr) minmax(0,1.2fr); gap:20px; align-items:center; margin-top:28px; }
.ring { position:relative; width:150px; height:150px; }
.ring svg { transform:rotate(-90deg); }
.ring .num { position:absolute; inset:0; display:grid; place-items:center; font:32px var(--font-mono); }
.dims { display:grid; gap:10px; }
.scorebar { display:flex; align-items:center; gap:10px; font-size:12px; }
.scorebar .label { width:84px; color:var(--secondary); }
.scorebar .track { flex:1; height:6px; background:var(--hairline); border-radius:999px; overflow:hidden; }
.scorebar .fill { height:100%; background:var(--ink); }
.summary { font-size:13px; color:var(--secondary); line-height:1.7; }
.q-card { padding:20px; background:var(--surface); border:1px solid var(--hairline); border-radius:6px; margin-top:16px; }
.q-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
.q-score { font:18px var(--font-mono); }
.q-score.low { color:var(--danger); }
.q-mine { color:var(--muted); font-size:12px; margin:10px 0; border-left:2px solid var(--hairline); padding-left:10px; }
.q-dims { font:11px var(--font-mono); color:var(--muted); margin:8px 0; }
.q-comment { font-size:13px; color:var(--secondary); line-height:1.7; }
.improve { margin-top:12px; padding:12px 14px; border:1px dashed #c9c9c9; border-radius:6px; background:var(--paper); font-size:13px; }
.improve strong { display:block; font-size:11px; font-family:var(--font-mono); color:var(--muted); margin-bottom:4px; }
.report-actions { display:flex; gap:10px; margin-top:24px; align-items:center; }
.tag { display:inline-block; padding:2px 8px; border:1px solid var(--hairline); border-radius:999px; color:var(--secondary); font-size:11px; }
.tag.red { color:var(--danger); border-color:var(--danger); }
@media (max-width: 900px) { .report-head { grid-template-columns: 1fr; } }
</style>
<title>练习报告</title></head>
<body><div id="app"></div><script type="module">
import { mount, shell } from '../shared/components.js';
const nav = [
  { href: './prep-home.html', label: '准备', pageId: 'prep-home' },
  { href: './interview-session.html', label: '面试', pageId: 'interview-session' },
  { href: './report-detail.html', label: '报告', pageId: 'report-detail' },
  { href: './mistake-book.html', label: '错题本', pageId: 'mistake-book' },
];
mount(shell({ active: 'report-detail', nav, content: `
<main class="page">
  <div class="eyebrow">Report · 字节跳动 产品经理（暑期实习） · 10-01 21:40 · 整场 10 题</div>
  <h1>练习报告</h1>
  <div class="report-head">
    <div class="ring" id="score-ring">
      <svg width="150" height="150"><circle cx="75" cy="75" r="66" fill="none" stroke="#ebebeb" stroke-width="10"/><circle cx="75" cy="75" r="66" fill="none" stroke="#171717" stroke-width="10" stroke-dasharray="299 415" stroke-linecap="round"/></svg>
      <div class="num">72</div>
    </div>
    <div class="dims" id="dimension-bars">
      <div class="scorebar"><span class="label">结构 24/30</span><div class="track"><div class="fill" style="width:80%"></div></div></div>
      <div class="scorebar"><span class="label">匹配度 21/30</span><div class="track"><div class="fill" style="width:70%"></div></div></div>
      <div class="scorebar"><span class="label">深度 18/25</span><div class="track"><div class="fill" style="width:72%"></div></div></div>
      <div class="scorebar"><span class="label">表达 9/15</span><div class="track"><div class="fill" style="width:60%"></div></div></div>
    </div>
    <p class="summary">总评：你的项目叙述有清晰的角色和结果（"从 6000 涨到 1.2 万"），这是强项。最弱的一环是<strong>归因</strong>——被追问数据变化原因时，回答停留在现象层。本场最值得练的一件事：给每个数据准备"动作→机制→数据"的归因句式。</p>
  </div>
  <p class="muted" style="font-size:11px">评分为 AI 建议仅供参考（D-02 校准中）；维度评价均引用你的原话。</p>

  <article class="q-card">
    <div class="q-head"><strong>Q3 · 请介绍你在校园公众号项目中负责的部分与数据变化</strong><span class="q-score">64<span style="font-size:11px;color:var(--muted)">/100</span></span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="tag">项目追问</span><span class="tag">难度 2/3</span><span class="tag">使用过提示</span></div>
    <p class="q-mine">你的回答摘要："我负责内容排期和两篇深度选题……平均阅读从 6000 涨到 1.2 万。"</p>
    <div class="q-dims">结构 20/30 · 匹配 18/30 · 深度 16/25 · 表达 10/15</div>
    <p class="q-comment">点评：你提到了结果（"翻了大约一倍"），但当被追问"翻倍的归因是什么"时，回答转向了执行细节，没有把动作和数据的因果关系讲清。</p>
    <div class="improve" id="improve-action"><strong>改进动作（明天就能练）</strong>为这个项目写一段"动作→机制→数据"归因句式：我做了 X（两篇深度选题）→ 因为 Y（深度内容在该群体转发率更高）→ 所以 Z（单篇阅读翻倍）。重练本题时先写这三段。</div>
  </article>

  <article class="q-card">
    <div class="q-head"><strong>Q7 · 如果公众号粉丝增长停滞，你的下一步动作是什么</strong><span class="q-score low">52<span style="font-size:11px">/100</span></span><span class="tag red">已自动入错题本</span></div>
    <p class="q-mine">你的回答摘要："会先做用户调研，然后调整内容方向。"</p>
    <div class="q-dims">结构 14/30 · 匹配 14/30 · 深度 15/25 · 表达 9/15</div>
    <p class="q-comment">点评："先调研再调整"方向正确但缺少结构——没有界定停滞的判断标准（多久算停滞？哪类内容下滑？），也没有给出可验证的假设。</p>
    <div class="improve"><strong>改进动作（明天就能练）</strong>用"界定问题→提出假设→最小验证"三段式重答本题，先在错题本中重练一次。</div>
  </article>

  <article class="q-card">
    <div class="q-head"><strong>Q1 · 自我介绍（1 分钟版本）</strong><span class="q-score">81<span style="font-size:11px;color:var(--muted)">/100</span></span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="tag">行为面</span><span class="tag">难度 1/3</span></div>
    <p class="q-dims">结构 26/30 · 匹配 24/30 · 深度 20/25 · 表达 11/15</div>
    <p class="q-comment">点评：结构完整、时长控制好；表达上口语连接词偏多（"然后""就是"共 9 次），面试场景可再压缩。</p>
  </article>

  <div class="report-actions">
    <a class="button primary" id="go-mistake-book" href="./mistake-book.html" data-nav="mistake-book">去错题本复习（3 题）</a>
    <button class="button">复制分享摘要</button>
    <a class="button" href="./prep-home.html" data-nav="prep-home">返回准备</a>
  </div>
</main>` }));
</script></body></html>
